<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>(Extension Name)</title>
        <link href="libs/bootstrap-5.0.2-dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="libs/bootstrap-5.0.2-dist/js/bootstrap.bundle.min.js" defer></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
        <style>
            /* main body */
            body {
                font-family: consolas;
                width: 600px;
                max-height: 750px;
            }

            /* tab bar */
            .nav-tabs {
                flex-wrap: nowrap;
                overflow-x: auto;
                overflow-y: hidden;
                white-space: nowrap;
                scrollbar-width: auto;
            }

            .nav-tabs::-webkit-scrollbar {
                height: 3px;
            }

            .nav-tabs::-webkit-scrollbar-thumb {
                background-color: #0d6efd;
                border-radius: 10px;
            }

            .nav-tabs::-webkit-scrollbar-track {
                background: transparent;
            }

            /* tab bar items */
            .nav-link {
                outline: none !important;
            }

            .nav-link.active {
                color: black !important;
            }

            /* tab content */
            /* tab content pane */
            .tab-pane {
                overflow-y: auto;
                max-height: 400px;
            }

            .tab-pane::-webkit-scrollbar {
                width: 3px;
                height: 3px;
            }

            .tab-pane::-webkit-scrollbar-thumb {
                background-color: #0d6efd;
                border-radius: 10px;
            }

            .tab-pane::-webkit-scrollbar-track {
                background: transparent;
            }

            .tab-pane .row {
                place-self: center;
            }

            /* tab contents pane items */
            .pane-items .btn-guide {
                padding: 0 8px;
                font-size: 0.8em;
                font-weight: bolder;
            }

            .pane-items input[type="text"],
            input[type="number"],
            input[type="color"] {
                height: 24px;
            }

            .pane-items input[type="number"] {
                width: 50px;
            }

            .pane-items input[type="color"] {
                width: 24px;
            }

            .pane-items select {
                height: 24px;
            }
        </style>
    </head>

    <body class="p-2 bg-dark border border-1 border-white h-auto">
        <div class="container-fluid p-0 border border-1 border-white h-auto">
            <!-- info -->
            <h5 class="my-2 text-center text-white" id="ext-info">
                <span id="ext-name">(Extension Name)</span> v<span id="ext-ver">(Extension Version)</span>
                <a id="ext-repo" href="https://github.com" target="_blank"><i class="fa-brands fa-github text-white"></i></a>
            </h5>

            <!-- tab bar -->
            <ul class="nav nav-tabs nav-justified bg-dark border border-top" id="tabBar" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active text-white rounded-0" id="tab-UI" data-bs-toggle="tab" data-bs-target="#tabUI" type="button" role="tab"
                        aria-selected="true" title="[Youtube Enhancement And Helper]&#10;This tab contains UI related features">
                        UI
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link text-white rounded-0" id="tab-texts" data-bs-toggle="tab" data-bs-target="#tabTexts" type="button" role="tab"
                        aria-selected="true" title="[Youtube Enhancement And Helper]&#10;This tab contains Texts related features">
                        Texts
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link text-white rounded-0" id="tab-player" data-bs-toggle="tab" data-bs-target="#tabPlayer" type="button" role="tab"
                        aria-selected="true" title="[Youtube Enhancement And Helper]&#10;This tab contains Player related features">
                        Player
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link text-white rounded-0" id="tab-utilities" data-bs-toggle="tab" data-bs-target="#tabUtilities" type="button"
                        role="tab" aria-selected="true" title="[Youtube Enhancement And Helper]&#10;This tab contains Utilities related features">
                        Utilities
                    </button>
                </li>
            </ul>

            <!-- tab content -->
            <div class="tab-content bg-dark p-2" id="tabContent">
                <!-- tab UI -->
                <div class="tab-pane fade show active text-white" id="tabUI" role="tabpanel" aria-labelledby="tab-UI">
                    <div class="pane-items row w-100 mb-2">
                        <div class="col-1 d-flex align-items-center justify-content-center form-check form-switch p-0 m-0">
                            <input class="form-check-input m-0" type="checkbox" role="switch" id="ui-videosPerRow-home" />
                        </div>
                        <div class="col-11 d-flex align-items-center flex-wrap">
                            <label class="form-check-label me-1" for="ui-videosPerRow-home">Videos per row (Home):</label>
                            <input class="me-2" type="number" id="ui-videosPerRow-home-count" value="3" step="1" min="1" onmousewheel="e.preventDefault();">
                            <button class="btn btn-info border-0 py-0 px-1" id="ui-videosPerRow-home-reset">Reset</button>
                        </div>
                    </div>
                    <div class="pane-items row w-100 mb-2">
                        <div class="col-1 d-flex align-items-center justify-content-center form-check form-switch p-0 m-0">
                            <input class="form-check-input m-0" type="checkbox" role="switch" id="ui-shortsPerRow-home" />
                        </div>
                        <div class="col-11 d-flex align-items-center flex-wrap">
                            <label class="form-check-label me-1" for="ui-shortsPerRow-home">Shorts per row (Home):</label>
                            <input class="me-2" type="number" id="ui-shortsPerRow-home-count" value="5" step="1" min="1" onmousewheel="e.preventDefault();">
                            <button class="btn btn-info border-0 py-0 px-1" id="ui-shortsPerRow-home-reset">Reset</button>
                        </div>
                    </div>
                    <div class="pane-items row w-100 mb-2">
                        <div class="col-1 d-flex align-items-center justify-content-center form-check form-switch p-0 m-0">
                            <input class="form-check-input m-0" type="checkbox" role="switch" id="ui-postsPerRow-home" />
                        </div>
                        <div class="col-11 d-flex align-items-center flex-wrap">
                            <label class="form-check-label me-1" for="ui-postsPerRow-home">Posts per row (Home):</label>
                            <input class="me-2" type="number" id="ui-postsPerRow-home-count" value="3" step="1" min="1" onmousewheel="e.preventDefault();">
                            <button class="btn btn-info border-0 py-0 px-1" id="ui-postsPerRow-home-reset">Reset</button>
                        </div>
                    </div>
                    <div class="pane-items row w-100 mb-2">
                        <div class="col-1 d-flex align-items-center justify-content-center form-check form-switch p-0 m-0">
                            <input class="form-check-input m-0" type="checkbox" role="switch" id="ui-othersPerRow-home" />
                        </div>
                        <div class="col-11 d-flex align-items-center flex-wrap">
                            <label class="form-check-label me-1" for="ui-othersPerRow-home">Others per row (Home):</label>
                            <input class="me-2" type="number" id="ui-othersPerRow-home-count" value="3" step="1" min="1" onmousewheel="e.preventDefault();">
                            <button class="btn btn-info border-0 py-0 px-1" id="ui-othersPerRow-home-reset">Reset</button>
                        </div>
                    </div>
                    <div class="pane-items row w-100 mb-2">
                        <div class="col-1 d-flex align-items-center justify-content-center form-check form-switch p-0 m-0">
                            <input class="form-check-input m-0" type="checkbox" role="switch" id="ui-relatedVideosPerRow-player" />
                        </div>
                        <div class="col-11 d-flex align-items-center flex-wrap">
                            <label class="form-check-label me-1" for="ui-relatedVideosPerRow-player">Related videos per row (Player):</label>
                            <input class="me-2" type="number" id="ui-relatedVideosPerRow-player-count" value="4" step="1" min="1"
                                onmousewheel="e.preventDefault();">
                            <button class="btn btn-info border-0 py-0 px-1" id="ui-relatedVideosPerRow-player-reset">Reset</button>
                        </div>
                    </div>

                    <div class="pane-items row w-100 mb-2">
                        <div class="col-1 d-flex align-items-center justify-content-center form-check form-switch p-0 m-0">
                            <input class="form-check-input m-0" type="checkbox" role="switch" id="ui-menuBtnPosFix-all" />
                        </div>
                        <div class="col-11 d-flex align-items-center flex-wrap">
                            <label class="form-check-label me-1" for="ui-menuBtnPosFix-all">Menu button position fix</label>
                        </div>
                    </div>
                </div>

                <!-- tab Texts -->
                <div class="tab-pane fade text-white" id="tabTexts" role="tabpanel" aria-labelledby="tab-texts">
                    <div class="pane-items row w-100 mb-2">
                        <div class="col-1 d-flex align-items-center justify-content-center form-check form-switch p-0 m-0">
                            <input class="form-check-input m-0" type="checkbox" role="switch" id="texts-videoTitleFull-home" />
                        </div>
                        <div class="col-11 d-flex align-items-center flex-wrap">
                            <label class="form-check-label me-1" for="texts-videoTitleFull-home">Video - Full title (Home)</label>
                        </div>
                    </div>
                    <div class="pane-items row w-100 mb-2">
                        <div class="col-1 d-flex align-items-center justify-content-center form-check form-switch p-0 m-0">
                            <input class="form-check-input m-0" type="checkbox" role="switch" id="texts-videoTitleFull-sidebar" />
                        </div>
                        <div class="col-11 d-flex align-items-center flex-wrap">
                            <label class="form-check-label me-1" for="texts-videoTitleFull-sidebar">Video - Full title (Player sidebar)</label>
                        </div>
                    </div>
                    <div class="pane-items row w-100 mb-2">
                        <div class="col-1 d-flex align-items-center justify-content-center form-check form-switch p-0 m-0">
                            <input class="form-check-input m-0" type="checkbox" role="switch" id="texts-videoTitleFull-plPanel" />
                        </div>
                        <div class="col-11 d-flex align-items-center flex-wrap">
                            <label class="form-check-label me-1" for="texts-videoTitleFull-plPanel">Video - Full title (inside Playlist panel)</label>
                        </div>
                    </div>
                    <div class="pane-items row w-100 mb-2">
                        <div class="col-1 d-flex align-items-center justify-content-center form-check form-switch p-0 m-0">
                            <input class="form-check-input m-0" type="checkbox" role="switch" id="texts-relatedVideoTitleFull-player" />
                        </div>
                        <div class="col-11 d-flex align-items-center flex-wrap">
                            <label class="form-check-label me-1" for="texts-relatedVideoTitleFull-player">Related videos - Full title (Player)</label>
                        </div>
                    </div>
                    <div class="pane-items row w-100 mb-2">
                        <div class="col-1 d-flex align-items-center justify-content-center form-check form-switch p-0 m-0">
                            <input class="form-check-input m-0" type="checkbox" role="switch" id="texts-videoChannelNameFull-all" />
                        </div>
                        <div class="col-11 d-flex align-items-center flex-wrap">
                            <label class="form-check-label me-1" for="texts-videoChannelNameFull-all">Video - Full channel name</label>
                        </div>
                    </div>
                    <div class="pane-items row w-100 mb-2">
                        <div class="col-1 d-flex align-items-center justify-content-center form-check form-switch p-0 m-0">
                            <input class="form-check-input m-0" type="checkbox" role="switch" id="texts-videoInfoFull-all" />
                        </div>
                        <div class="col-11 d-flex align-items-center flex-wrap">
                            <label class="form-check-label me-1" for="texts-videoInfoFull-all">Video - Full info</label>
                        </div>
                    </div>

                    <div class="pane-items row w-100 mb-2">
                        <div class="col-1 d-flex align-items-center justify-content-center form-check form-switch p-0 m-0">
                            <input class="form-check-input m-0" type="checkbox" role="switch" id="texts-plTitleFull-home" />
                        </div>
                        <div class="col-11 d-flex align-items-center flex-wrap">
                            <label class="form-check-label me-1" for="texts-plTitleFull-home">Playlist - Full title (Home)</label>
                        </div>
                    </div>
                    <div class="pane-items row w-100 mb-2">
                        <div class="col-1 d-flex align-items-center justify-content-center form-check form-switch p-0 m-0">
                            <input class="form-check-input m-0" type="checkbox" role="switch" id="texts-plInfoFull-all" />
                        </div>
                        <div class="col-11 d-flex align-items-center flex-wrap">
                            <label class="form-check-label me-1" for="texts-plInfoFull-all">Playlist - Full info</label>
                        </div>
                    </div>

                    <div class="pane-items row w-100 mb-2">
                        <div class="col-1 d-flex align-items-center justify-content-center form-check form-switch p-0 m-0">
                            <input class="form-check-input m-0" type="checkbox" role="switch" id="texts-shortsTitleFull-all" />
                        </div>
                        <div class="col-11 d-flex align-items-center flex-wrap">
                            <label class="form-check-label me-1" for="texts-shortsTitleFull-all">Shorts - Full title</label>
                        </div>
                    </div>

                    <div class="pane-items row w-100 mb-2">
                        <div class="col-1 d-flex align-items-center justify-content-center form-check form-switch p-0 m-0">
                            <input class="form-check-input m-0" type="checkbox" role="switch" id="texts-channelInfoFull-player" />
                        </div>
                        <div class="col-11 d-flex align-items-center flex-wrap">
                            <label class="form-check-label me-1" for="texts-channelInfoFull-player">Full channel info (Under player)</label>
                        </div>
                    </div>
                    <div class="pane-items row w-100 mb-2">
                        <div class="col-1 d-flex align-items-center justify-content-center form-check form-switch p-0 m-0">
                            <input class="form-check-input m-0" type="checkbox" role="switch" id="texts-joinMbsBtnFix-player" />
                        </div>
                        <div class="col-11 d-flex align-items-center flex-wrap">
                            <label class="form-check-label me-1" for="texts-joinMbsBtnFix-player">Fix "Join Membership" button</label>
                        </div>
                    </div>
                </div>

                <!-- tab Player -->
                <div class="tab-pane fade text-white" id="tabPlayer" role="tabpanel" aria-labelledby="tab-player">
                    <div class="pane-items row w-100 mb-2">
                        <div class="col-1 d-flex align-items-center justify-content-center form-check form-switch p-0 m-0">
                            <input class="form-check-input m-0" type="checkbox" role="switch" id="player-controlsBgCustom" />
                        </div>
                        <div class="col-11 d-flex align-items-center flex-wrap">
                            <label class="form-check-label me-1" for="player-controlsBgCustom">Controls background custom:</label>

                            <div class="d-flex align-items-center mt-1 w-100">
                                <span class="me-1" style="min-width: 45px;">Color:</span>
                                <input class="me-1" type="color" id="player-controlsBgCustom-color" value="#484848" />
                                <span class="me-1">|</span>
                                <span class="me-1">Alpha:</span>
                                <input class="me-1" type="number" id="player-controlsBgCustom-colorAlpha" value="0.3" step="0.05" min="0" max="1"
                                    onmousewheel="e.preventDefault();">
                                <span class="me-1">|</span>
                                <span class="me-1" style="min-width: 45px;">Height:</span>
                                <input class="me-1" type="number" id="player-controlsBgCustom-height" value="12" step="1" min="0"
                                    onmousewheel="e.preventDefault();">
                                <select class="me-1 d-flex flex-column" id="player-controlsBgCustom-heightUnit">
                                    <option value="px">px</option>
                                    <option value="%">%</option>
                                    <option value="em">em</option>
                                    <option value="rem">rem</option>
                                </select>
                                <span class="me-1">|</span>
                                <button class="btn btn-info border-0 py-0 px-1" id="player-controlsBgCustom-reset">Reset</button>
                            </div>
                        </div>
                    </div>
                    <div class="pane-items row w-100 mb-2">
                        <div class="col-1 d-flex align-items-center justify-content-center form-check form-switch p-0 m-0">
                            <input class="form-check-input m-0" type="checkbox" role="switch" id="player-persistentProgressBar" />
                        </div>
                        <div class="col-11 d-flex align-items-center flex-wrap">
                            <label class="form-check-label me-1" for="player-persistentProgressBar">Persistent progress bar:</label>
                            <div class="d-flex align-items-center mt-1 w-100">
                                <span class="me-1">Color:</span>
                                <input class="me-1" type="color" id="player-persistentProgressBar-color" value="#B2071D">
                                <span class="me-1">|</span>
                                <span class="me-1">Height:</span>
                                <input class="me-1" type="number" id="player-persistentProgressBar-height" value="3" step="1" min="1" style="width: 50px;">
                                <span class="me-1">px</span>
                                <span class="me-1">|</span>
                                <span class="me-1">Delay:</span>
                                <input class="me-1" type="number" id="player-persistentProgressBar-delay" value="1000" step="1" min="100" style="width: 60px;">
                                <span class="me-1">ms</span>
                                <span class="me-1">|</span>
                                <button class="btn btn-info border-0 py-0 px-1" id="player-persistentProgressBar-reset">Reset</button>
                            </div>
                        </div>
                    </div>

                    <div class="pane-items row w-100 mb-2">
                        <div class="col-1 d-flex align-items-center justify-content-center form-check form-switch p-0 m-0">
                            <input class="form-check-input m-0" type="checkbox" role="switch" id="player-pipPlayer" />
                        </div>
                        <div class="col-11 d-flex align-items-center flex-wrap">
                            <label class="form-check-label me-1" for="player-pipPlayer">Picture-in-Picture player</label>
                        </div>
                    </div>
                </div>

                <!-- tab Utilities -->
                <div class="tab-pane fade text-white" id="tabUtilities" role="tabpanel" aria-labelledby="tab-utilities">
                    <div class="pane-items row w-100 mb-2">
                        <div class="col-1 d-flex align-items-center justify-content-center form-check form-switch p-0 m-0">
                            <input class="form-check-input m-0" type="checkbox" role="switch" id="utilities-shortsToWatch" />
                        </div>
                        <div class="col-11 d-flex align-items-center flex-wrap">
                            <label class="form-check-label me-1" for="utilities-shortsToWatch">Watch shorts in '/watch' view</label>
                        </div>
                    </div>
                    <div class="pane-items row w-100 mb-2">
                        <div class="col-1 d-flex align-items-center justify-content-center form-check form-switch p-0 m-0">
                            <input class="form-check-input m-0" type="checkbox" role="switch" id="utilities-noPlaylistTrap" />
                        </div>
                        <div class="col-11 d-flex align-items-center flex-wrap">
                            <label class="form-check-label me-1" for="utilities-noPlaylistTrap">Watch video without trapped into a playlist</label>
                        </div>
                    </div>
                    <div class="pane-items row w-100 mb-2">
                        <div class="col-1 d-flex align-items-center justify-content-center form-check form-switch p-0 m-0">
                            <input class="form-check-input m-0" type="checkbox" role="switch" id="utilities-channelRedirImprove" />
                        </div>
                        <div class="col-11 d-flex align-items-center flex-wrap">
                            <label class="form-check-label me-1" for="utilities-channelRedirImprove">Improve channel redirection</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="DEFAULT_SETTINGS.js"></script>
        <script src="popup-core.js"></script>
        <script src="popup-ui.js"></script>
        <script src="popup-texts.js"></script>
        <script src="popup-player.js"></script>
        <script src="popup-utilities.js"></script>
    </body>

</html>
